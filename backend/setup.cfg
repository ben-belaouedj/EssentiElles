[flake8]
max-line-length = 120
exclude = .venv, venv, __pycache__, .git
extend-ignore =
    # dotenv must be loaded before app imports (E402)
    E402
per-file-ignores =
    # Seed script & embedded catalog data hold long descriptions on purpose
    seed_database.py: E501, F541
    server.py: E501


[isort]
profile = black

[mypy]
ignore_missing_imports = True
# FastAPI + Motor/MongoDB use dynamic typing; those error codes are pure noise
# for this codebase (endpoints return Any, documents are Optional dicts).
disable_error_code = func-returns-value, union-attr, var-annotated, assignment, return-value, attr-defined, index, arg-type, call-arg, dict-item, has-type, override
